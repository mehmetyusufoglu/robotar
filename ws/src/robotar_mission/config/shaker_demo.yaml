# Mission parameters for the Robotar branch clamp-shaker demo.
#
# Scope: mission timing/tolerances, arm joint poses, sweep stepping and the
# no-contact verification mode. Orchard geometry, olive IDs, branch
# collision names, drive target, topic names, the clamp geometry
# (pad_face_offset, max_opening, max_effort) and the operational envelope
# (10-25 Hz sweep, shake duration) are NOT duplicated here — they come from
# robotar_gazebo/config/orchard.yaml and
# robotar_description/config/physical.yaml (paths injected by the launch
# file).
#
# Arm poses are six values in physical.yaml robotar.arm.joints order:
#   [arm_yaw, shoulder_pitch, elbow_pitch, wrist_pitch, wrist_roll, tool_pitch]
# Solved numerically (forward kinematics from physical.yaml, then swept-path
# clearance checks against the branch cylinder AND the six olives, robot at
# the worst-case drive stop x=2.98) so that after driving to drive_to_x the
# open jaws slide over the branch tip (approach_pose -> clamp_pose) and the
# pad clamp center lands on target_branch at (3.5, y=-2.70, z=1.44) with the
# pads closing across the branch axis.
#
# 2026-10-21 redesign (see DEVELOPMENT_LOG): the previous pose family drove
# the tool housing INTO the olive cluster (olives are welded to the tree
# until detach; the contact wedged the arm mid-trajectory and every APPROACH
# aborted on goal_time_tolerance). The fix has three parts:
#   1. jaw_length 0.12 -> 0.30 in physical.yaml: long hook jaws keep the
#      bulky housing below the olive cluster and deepen the jaw mouth.
#   2. Poses re-solved against the new pad height with the shoulder FREE:
#      approach/clamp share the exact clamp orientation (pure-translation
#      slide, mouth square to the branch — a pinned shoulder was tried and
#      left an 11 deg mouth tilt that rubbed the branch on the pads).
#      Every tool collision box stays >= 1 cm clear of olives/branch along
#      the swept mission path, and every joint keeps >= 0.20 rad (wrist
#      >= 0.30 rad) from its URDF limits (DART latches joints driven onto
#      their limits).
#   3. miss mode shifts the WHOLE maneuver +0.22 m in +x (miss_approach_pose
#      and miss_clamp_pose) so the branch never enters the jaw mouth: the
#      jaws close on air, clamp never verifies, zero detach commands.
#
# The approach/clamp/retract moves are staged as separate single-point
# trajectories in shaker_demo.py so every segment starts from standstill.

odom_driver:
  ros__parameters:
    use_sim_time: true
    # orchard_config_path / physical_config_path are injected by the launch file.
    control_rate_hz: 20.0
    position_tolerance_m: 0.02
    drive_timeout_s: 45.0
    odom_timeout_s: 3.0
    kp_linear: 0.6
    kp_lateral: 1.0
    kp_yaw: 1.2

shaker_demo:
  ros__parameters:
    use_sim_time: true
    # orchard_config_path / physical_config_path are injected by the launch file.
    miss_contact: false   # true = deliberate miss pose: clamp never verifies,
                          # no shake, no detach, clean failure

    stow_pose: [-1.0552, 1.6000, -1.5053, -1.8339, -0.5084, -0.2774]
    pre_position_pose: [-1.0762, 1.5500, -1.0803, -2.0500, -0.5132, 0.0481]
    approach_pose: [-1.0667, 1.5216, -1.0454, -1.8465, -0.4914, 0.1243]
    clamp_pose: [-1.2486, 0.8380, -0.0507, -2.0500, -0.3151, 0.0078]
    miss_approach_pose: [-0.7946, 1.2016, -0.6349, -2.0006, -0.7598, 0.2021]
    miss_clamp_pose: [-1.0716, 0.7828, 0.0000, -1.9700, -0.4815, -0.0078]

    stow_duration_s: 6.0
    pre_position_duration_s: 6.0
    approach_duration_s: 5.0
    # Split into two segments via the slide midpoint in shaker_demo.py, so
    # the slide runs 2 x 3.0 s (simulation timing tuning value).
    clamp_slide_duration_s: 6.0
    retract_duration_s: 6.0

    controller_wait_timeout_s: 90.0
    action_timeout_s: 40.0
    drive_status_timeout_s: 60.0
    stop_settle_s: 2.0

    stationary_linear_threshold: 0.02   # m/s, base-stationary rotor interlock
    stationary_angular_threshold: 0.03  # rad/s

    clamp_interference_m: 0.004   # goal = branch_radius + pad_face_offset - this
    goal_tolerance_rad: 0.05      # abort the arm action if tracking diverges
                                  # (wedged joint) instead of drifting on
    clamp_action_timeout_s: 25.0
    clamp_verify_timeout_s: 8.0

    # Frequency sweep: physical.yaml tools.shaker.rotors owns the 10-25 Hz
    # range and the shake duration; these are the sweep resolution/timing.
    sweep_step_hz: 3.0
    sweep_step_duration_s: 0.9

    detach_ack_timeout_s: 10.0
    mission_timeout_s: 420.0
